services:
  postgres:
    image: postgres:16-alpine
    container_name: grad_postgres
    environment:
      POSTGRES_USER: grad
      POSTGRES_PASSWORD: grad
      POSTGRES_DB: graduation
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/docker-init.sql:/docker-entrypoint-initdb.d/00-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grad -d graduation"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: grad_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
