# :443 — TLS (Let's Encrypt) + reverse proxy to gunicorn on 127.0.0.1:5000 (with WebSocket upgrade)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name checkin.wokdiary.com;

    ssl_certificate     /etc/letsencrypt/live/checkin.wokdiary.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkin.wokdiary.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:grad_ssl:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
