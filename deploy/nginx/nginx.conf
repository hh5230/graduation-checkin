# Dedicated nginx instance for graduation-checkin (does NOT load /etc/nginx/sites-enabled,
# so other projects' site configs on this host are never activated or modified).
# Installed to /etc/graduation-checkin/nginx.conf, run by graduation-checkin-nginx.service.
user www-data;
worker_processes auto;
pid /run/graduation-checkin-nginx.pid;
error_log /var/log/graduation-checkin-nginx/error.log warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log /var/log/graduation-checkin-nginx/access.log;
    client_body_temp_path /var/lib/graduation-checkin-nginx/body;
    proxy_temp_path       /var/lib/graduation-checkin-nginx/proxy;
    fastcgi_temp_path     /var/lib/graduation-checkin-nginx/fastcgi;
    uwsgi_temp_path       /var/lib/graduation-checkin-nginx/uwsgi;
    scgi_temp_path        /var/lib/graduation-checkin-nginx/scgi;
    client_max_body_size 10m;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # :80 — ACME http-01 challenge + redirect everything else to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name checkin.wokdiary.com;
        location ^~ /.well-known/acme-challenge/ { root /var/www/graduation-checkin-acme; }
        location / { return 301 https://$host$request_uri; }
    }

    include /etc/graduation-checkin/https.conf*;
}
