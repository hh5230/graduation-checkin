{% extends "base.html" %}
{% set page = 'entry' %}
{% set title_key = 'nav.entry' %}
{% block title %}入场签到{% endblock %}
{% block content %}
<div class="page-heading"><h1 data-i18n="nav.entry">入场签到</h1></div>
<div class="banner" id="entry-notice" role="status" hidden></div>
<div class="counter-grid">
  {{ scan_panel('entry.lookup', '查找参与者') }}
  <div class="panel-stack">
    <section id="confirmation" class="panel confirmation" hidden aria-labelledby="confirm-title">
      <h2 id="confirm-title" data-i18n="entry.review">核对参与者资料</h2>
      <div id="entry-person"></div>
      <div class="actions">
        <button class="button primary large" type="button" id="confirm-checkin" data-i18n="entry.confirm">确认签到</button>
        <button class="button" type="button" id="cancel-checkin" data-i18n="common.cancel">取消</button>
      </div>
    </section>
    <section class="panel">
      <h2 data-i18n="entry.recent">本次最近签到</h2>
      <ol class="person-list" id="recent-checkins" data-user="{{ current_user.id if current_user else '' }}"></ol>
    </section>
  </div>
</div>
{% endblock %}
{% block scripts %}{{ scanner_scripts() }}
<script defer src="{{ url_for('static', filename='js/entry.js') }}"></script>
{% endblock %}
