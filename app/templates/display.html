{% from "_icons.html" import icon %}
{% from "_ui.html" import socket_scripts, tr %}
<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="nav.display">舞台大屏</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script defer src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/api.js') }}"></script>
  {{ socket_scripts() }}
  <script defer src="{{ url_for('static', filename='js/display.js') }}"></script>
</head>
<body class="display-body">
  <main class="display-layout">
    <header class="display-header"><span class="brand"><span class="brand-mark">{{ icon('graduation-cap') }}</span>{{ tr('app.name','GradCheck') }}</span>
      <span class="offline-dot" id="conn-status" role="status" data-i18n-title="connection.offline"><span class="visually-hidden" data-i18n="connection.offline">离线</span></span></header>
    <div class="banner" role="alert" id="state-notice" hidden></div>
    <div class="banner" role="status" id="display-notice" hidden></div>
    <section class="display-hero" aria-live="polite" aria-atomic="true">
      <div id="display-person"><div class="display-label" id="display-label" hidden data-i18n="display.now">正在上台</div>
      <h1 id="display-name" data-i18n="display.idle">准备中</h1><p id="display-code"></p></div>
    </section>
    <footer class="display-queue" aria-live="polite"><span data-i18n="display.nextLabel">下一位：</span> <strong id="display-next">—</strong></footer>
  </main>
</body></html>
